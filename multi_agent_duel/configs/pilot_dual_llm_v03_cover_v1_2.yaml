# Active collection config for mid/late macro & building coverage.
# Keeps natural LLM decisions; denser economy/tech queries and sparser attack
# probes so mid/late stages can still emit macro/building without forced labels.
config_name: pilot_dual_llm_v03_cover_v1
config_version: "1.2.0"
prompt_template_version: swarmbrain_zvz_opening_ingame_v1
fallback_strategy_version: none_v1

map_name: AutomatonLE
player_1_race: Zerg
player_2_race: Zerg

realtime: false

macro_every: 60
building_every: 30
attack_every: 180
attack_min_army: 18

max_game_time_sec: 1200

model_provider: openai_compatible
model_name: null
temperature: null

random_seed: null
random_seed_strategy: generate_per_run_if_unset

disable_redis_bridge: true
