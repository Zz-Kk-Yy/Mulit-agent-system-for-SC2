# Active collection after paper intake 2026-07-29.
# Priority natural gaps (paper windows): late×macro, mid×macro, mid×building,
# late×building, early×attack. No forced channel labels in prompts.
config_name: pilot_dual_llm_v03_cover_v1
config_version: "1.3.0"
prompt_template_version: swarmbrain_zvz_opening_ingame_v1
fallback_strategy_version: none_v1

map_name: AutomatonLE
player_1_race: Zerg
player_2_race: Zerg

realtime: false

# Keep macro/building probes alive into mid/late; attack remains army-gated
# so early attack can appear when a small force forms, without mid/late
# permanently collapsing to attack-only.
macro_every: 45
building_every: 25
attack_every: 150
attack_min_army: 12

max_game_time_sec: 1200

model_provider: openai_compatible
model_name: null
temperature: null

random_seed: null
random_seed_strategy: generate_per_run_if_unset

disable_redis_bridge: true
